<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>DevClass</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" type="text/css" href="../css/index2.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined"
    />
  </head>
  <body>
    <header class="header">
      <div class="points">
        <div class="streak">
          <span class="material-symbols-outlined header-icons">
            local_fire_department
          </span>
          <p class="header-contents">3</p>
        </div>
        <div class="coins">
          <span class="material-symbols-outlined header-icons"> paid </span>
          <p class="header-contents">3</p>
        </div>
      </div>
      <div class="header-labels">
        <p>DevClass</p>
      </div>
      <div class="functional">
        <div class="notifications notification-active" id="notification-active">
          <button
            type="button"
            class="header-buttons"
            onclick="mostrar('notifications.html')"
          >
            <span class="material-symbols-outlined header-icons">
              notifications
            </span>
          </button>
        </div>
        <div class="settings">
          <button
            type="button"
            class="header-buttons"
            onclick="mostrar('settings.html')"
          >
            <span class="material-symbols-outlined header-icons">
              settings
            </span>
          </button>
        </div>
      </div>
    </header>
    <div class="divider"></div>
    <main class="content">
      <!-- card da meta diaria -->
      <section class="card daily-goal">
        <div class="content-goals">
          <div class="goals-info">
            <h4 class="card-header">Meta diária</h4>
            <p class="main-contents">45/100 XP</p>
          </div>
          <div class="progress-bar-container">
            <div class="progress-bar"></div>
          </div>
          <p class="main-contents">
            Faltam apenas 55XP para completar sua meta diária
          </p>
        </div>
      </section>
      <button
        type="button"
        class="main-buttons"
        onclick="mostrar('settings.html')"
      >
        Escolher nova linguagem
      </button>

      <!-- comeco da trilha -->
      <h3 class="main-header">Trilha Javascript</h3>
      <!-- trilha de aprendizado -->
      <section>
        <div class="roadmap">
          <div class="road"></div>
          <button
            type="button"
            class="card lesson finished"
            onclick="mostrar('lesson.html')"
          >
            <div class="lesson-header">
              <h4 class="card-header">Meta diária</h4>
              <span class="material-symbols-outlined lesson-icon">
                check_circle
              </span>
            </div>
            <p class="main-contents">
              Faltam apenas 55XP para completar sua meta diária
            </p>
            <div class="lesson-footer">
              <p class="main-labels">30XP</p>
              <p class="main-labels">Concluída</p>
            </div>
          </button>
          <button
            type="button"
            class="card lesson"
            onclick="mostrar('lesson.html')"
          >
            <div class="lesson-header">
              <h4 class="card-header">Meta diária</h4>
              <span class="material-symbols-outlined"> play_arrow </span>
            </div>
            <p class="main-contents">
              Faltam apenas 55XP para completar sua meta diária
            </p>
            <div class="lesson-footer">
              <p class="main-labels">30XP</p>
              <p class="main-labels">A fazer</p>
            </div>
          </button>
          <button
            type="button"
            class="card lesson blocked"
            onclick="alert('Conclua as licoes anteriores para desbloquar essa licao')"
          >
            <div class="lesson-header">
              <h4 class="card-header">Meta diária</h4>
              <span class="material-symbols-outlined lesson-icon"> lock </span>
            </div>
            <p class="main-contents">
              Faltam apenas 55XP para completar sua meta diária
            </p>
            <div class="lesson-footer">
              <p class="main-labels">30XP</p>
              <p class="main-labels">A fazer</p>
            </div>
          </button>
          <button
            type="button"
            class="card lesson blocked"
            onclick="alert('Conclua as licoes anteriores para desbloquar essa licao')"
          >
            <div class="lesson-header">
              <h4 class="card-header">Meta diária</h4>
              <span class="material-symbols-outlined lesson-icon"> lock </span>
            </div>
            <p class="main-contents">
              Faltam apenas 55XP para completar sua meta diária
            </p>
            <div class="lesson-footer">
              <p class="main-labels">30XP</p>
              <p class="main-labels">A fazer</p>
            </div>
          </button>
          <button
            type="button"
            class="card lesson blocked"
            onclick="alert('Conclua as licoes anteriores para desbloquar essa licao')"
          >
            <div class="lesson-header">
              <h4 class="card-header">Meta diária</h4>
              <span class="material-symbols-outlined lesson-icon"> lock </span>
            </div>
            <p class="main-contents">
              Faltam apenas 55XP para completar sua meta diária
            </p>
            <div class="lesson-footer">
              <p class="main-labels">30XP</p>
              <p class="main-labels">A fazer</p>
            </div>
          </button>
        </div>
      </section>
    </main>
    <nav class="navigation">
      <button
        type="button"
        class="nav-buttons nav-active"
        onclick="mostrar('index2.html')"
        active
      >
        <span class="material-symbols-outlined nav-icons">home</span>
        Aprender
      </button>

      <button
        type="button"
        class="nav-buttons"
        onclick="mostrar('ranking.html')"
      >
        <span class="material-symbols-outlined nav-icons">leaderboard</span>
        Ranking
      </button>

      <button
        type="button"
        class="nav-buttons"
        onclick="mostrar('profile.html')"
      >
        <span class="material-symbols-outlined nav-icons">person</span>
        Perfil
      </button>
    </nav>
    <script>
      function mostrar(id) {
        location.href = id;
      }
    </script>
  </body>
</html>
