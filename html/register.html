<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DevClass</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="stylesheet" type="text/css" href="../css/index.css">
   <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" />
</head>
<body>
  <header class="header">
    <div class="streak">
      <span class="material-symbols-outlined icons">local_fire_department</span>
    </div>
    <div class="coins">
      <span class="material-symbols-outlined icons">paid</span>
    </div>
    <div class="notifications">
      <span class="material-symbols-outlined icons">notifications</span>
    </div>
    <div class="settings">
      <span class="material-symbols-outlined icons">settings</span>
    </div>
    <div class="profile">
      <span class="material-symbols-outlined icons">person</span>
    </div>
  </header>  
  <!-- 🧑 Tela de Cadastro -->
  <section id="tela-cadastro" >
    <h2>Criar conta</h2>
    <form>
      <input type="text" placeholder="Nome completo" required><br>
      <input type="email" placeholder="Email" required><br>
      <input type="password" placeholder="Senha" required><br>
      <button type="submit">Cadastrar</button>
    </form>
  </section>


</body>
</html>
