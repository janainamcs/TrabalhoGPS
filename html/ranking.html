<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>DevClass</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" type="text/css" href="../css/ranking.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined"
    />
  </head>
  <body>
    <header>
      <div class="header">
        <svg xmlns="http://www.w3.org/2000/svg" height="48px" viewBox="0 -960 960 960" width="48px" fill="#FFC800"><path d="M298-120v-60h152v-148q-54-11-96-46.5T296-463q-74-8-125-60t-51-125v-44q0-25 17.5-42.5T180-752h104v-88h392v88h104q25 0 42.5 17.5T840-692v44q0 73-51 125t-125 60q-16 53-58 88.5T510-328v148h152v60H298Zm-14-406v-166H180v44q0 45 29.5 78.5T284-526Zm196 141q57 0 96.5-40t39.5-97v-258H344v258q0 57 39.5 97t96.5 40Zm196-141q45-10 74.5-43.5T780-648v-44H676v166Zm-196-57Z"/></svg>
        <h3 class="header-labels">Ranking</h3>
      </div>
      <div class="divider"></div>
    </header>
    <main class="content">
      <div class="filter">
        <button
            type="button"
            class="filter-button active"
            onclick="sortRanking()"
          >
            <p class="header-contents">
              Ranking geral
            </p>
          </button>
        <button
            type="button"
            class="filter-button"
            onclick="sortRanking()"
          >
            <p class="header-contents">
              Meus amigos
            </p>
          </button>
      </div>
      <!-- card das conquistas -->
      <section class="card">
        <div class="ranking">
          <div class="ranking-item">
              <div class="photo-container">
                <img src="../images/user.png" alt="foto de perfil" class="user-photo">
              </div>
              <div class="text-area">
                <p class="main-labels">Primeira licão</p>
                <p class="main-contents">Conclua sua primeira tarefa no DevClass!</p>
              </div>
            </div>
        </div>
          
        </div>
      </section>
    </main>
    <nav class="navigation">
      <button type="button" class="nav-buttons" onclick="mostrar('index.html')" data-page="index.html">
        <span class="material-symbols-outlined nav-icons">home</span>
        Aprender
      </button>
      
      <button type="button" class="nav-buttons" onclick="mostrar('ranking.html')" data-page="ranking.html">
        <span class="material-symbols-outlined nav-icons">leaderboard</span>
        Ranking  
      </button>

      <button type="button" class="nav-buttons" onclick="mostrar('profile.html')" data-page="profile.html">
        <span class="material-symbols-outlined nav-icons">person</span>
        Perfil
      </button>
    </nav>
    <script src="../js/script.js"></script>
  </body>
</html>
