    <main class="content">
      <!-- card do usuario -->
      <section class="card">
        <div class="photo-container">
          <img src="../images/user.png" alt="foto de perfil" class="user-photo">
          <button type="button" class="user-buttons" onclick="mostrar('settings.html')">
            <span class="material-symbols-outlined main-icons">
              photo_camera
            </span>
          </button>
        </div>
        <div class="text-container">
          <p class="user-name"> João Silva </p>
          <p class="user-infos"> joao@email.com </p>
          <p class="user-infos"> Membro desde Janeiro de 2025 </p>
        </div>
        <button type="button" class="main-buttons" onclick="mostrar('settings.html')">
          Editar perfil
        </button>
      </section>
      <!-- card das estatisticas -->
      <section class="card">
        <h4 class="card-header">Suas estatísticas</h4>
        <div class="stats">
          <div class="wins">
            <svg xmlns="http://www.w3.org/2000/svg" height="48px" viewBox="0 -960 960 960" width="48px" fill="#1CB0F6"><path d="M298-120v-60h152v-148q-54-11-96-46.5T296-463q-74-8-125-60t-51-125v-44q0-25 17.5-42.5T180-752h104v-88h392v88h104q25 0 42.5 17.5T840-692v44q0 73-51 125t-125 60q-16 53-58 88.5T510-328v148h152v60H298Zm-14-406v-166H180v44q0 45 29.5 78.5T284-526Zm196 141q57 0 96.5-40t39.5-97v-258H344v258q0 57 39.5 97t96.5 40Zm196-141q45-10 74.5-43.5T780-648v-44H676v166Zm-196-57Z"/></svg>
            <p class="main-labels">3 conquistas</p>
            <p class="main-contents">Conquistas</p>
          </div>
          <div class="streak">
            <svg xmlns="http://www.w3.org/2000/svg" height="48px" viewBox="0 -960 960 960" width="48px" fill="#FF9600"><path d="M220-400q0 63 28.5 118.5T328-189q-4-12-6-24.5t-2-24.5q0-32 12-60t35-51l113-111 113 111q23 23 35 51t12 60q0 12-2 24.5t-6 24.5q51-37 79.5-92.5T740-400q0-54-23-105.5T651-600q-21 15-44 23.5t-46 8.5q-61 0-101-41.5T420-714v-20q-46 33-83 73t-63 83.5q-26 43.5-40 89T220-400Zm260 24-71 70q-14 14-21.5 31t-7.5 37q0 41 29 69.5t71 28.5q42 0 71-28.5t29-69.5q0-20-7.5-37T551-306l-71-70Zm0-464v132q0 34 23.5 57t57.5 23q18 0 33.5-7.5T622-658l18-22q74 42 117 117t43 163q0 134-93 227T480-80q-134 0-227-93t-93-227q0-128 86-246.5T480-840Z"/></svg>
            <p class="main-labels">3 dias</p>
            <p class="main-contents">Ofensiva</p>
          </div>
          <div class="coins">
            <svg xmlns="http://www.w3.org/2000/svg" height="48px" viewBox="0 -960 960 960" width="48px" fill="#FFC800"><path d="M451-193h55v-52q61-7 95-37.5t34-81.5q0-51-29-83t-98-61q-58-24-84-43t-26-51q0-31 22.5-49t61.5-18q30 0 52 14t37 42l48-23q-17-35-45-55t-66-24v-51h-55v51q-51 7-80.5 37.5T343-602q0 49 30 78t90 54q67 28 92 50.5t25 55.5q0 32-26.5 51.5T487-293q-39 0-69.5-22T375-375l-51 17q21 46 51.5 72.5T451-247v54Zm29 113q-82 0-155-31.5t-127.5-86Q143-252 111.5-325T80-480q0-83 31.5-156t86-127Q252-817 325-848.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 82-31.5 155T763-197.5q-54 54.5-127 86T480-80Zm0-60q142 0 241-99.5T820-480q0-142-99-241t-241-99q-141 0-240.5 99T140-480q0 141 99.5 240.5T480-140Zm0-340Z"/></svg>
            <p class="main-labels">3 XP</p>
            <p class="main-contents">XP Total</p>
          </div>
        </div>
      </section>
      <!-- card das conquistas -->
      <section class="card">
        <h4 class="card-header">Suas conquistas</h4>
        <!-- lista de conquistas -->
        <div class="achievements-list">
          <!-- item da lista -->
          <div class="achievements-item">
            <div class="achievements-icon">
              <span class="material-symbols-outlined main-icons">
                trophy
              </span>
            </div>
            <div class="achievements-text-area">
              <p class="main-labels">Primeira licão</p>
              <p class="main-contents">Conclua sua primeira tarefa no DevClass!</p>
            </div>
          </div>
          <!-- divisor -->
          <div class="divider"></div>
          <!-- item da lista -->
          <div class="achievements-item">
            <div class="achievements-icon active">
              <span class="material-symbols-outlined main-icons">
                trophy
              </span>
            </div>
            <div class="achievements-text-area">
              <p class="main-labels">Primeira licão</p>
              <p class="main-contents">Conclua sua primeira tarefa no DevClass!</p>
            </div>
          </div>
        </div>
      </section>
