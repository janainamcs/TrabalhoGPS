<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>DevClass</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" type="text/css" href="../css/lessons.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined"
    />
  </head>
  <body>
    <header>
      <div class="header">
        <div class="back">
          <button type="button" class="header-buttons" onclick="check()">
            <span class="material-symbols-outlined header-icons">
              arrow_back
            </span>
          </button>
        </div>
        <div class="progress-bar-container">
          <div class="progress-bar"></div>
        </div>
        <div class="points">
          <div class="lifes">
            <span class="material-symbols-outlined"> favorite </span>
            <p class="header-contents">3</p>
          </div>
          <div class="coins">
            <span class="material-symbols-outlined header-icons"> paid </span>
            <p class="header-contents">3</p>
          </div>
        </div>
      </div>
      <div class="divider"></div>
    </header>

    <main class="content">
      <!-- pagina da pergunta -->
      <div class="card question">
        <h4 class="card-header">
          Qual a forma correta de declarar uma variável em Python?
        </h4>
        <div class="options-list">
          <div class="card option-item">
            <input type="radio" id="option1" name="answer" value="option1" />
            <label for="option1" class="main-contents">option1</label>
          </div>
          <div class="card option-item">
            <input type="radio" id="option2" name="answer" value="option2" />
            <label for="option2" class="main-contents">option2</label>
          </div>
          <div class="card option-item">
            <input type="radio" id="option3" name="answer" value="option3" />
            <label for="option3" class="main-contents">option3</label>
          </div>
        </div>
        <button type="submit" class="main-buttons" disabled>Verificar</button>
      </div>
    </main>
